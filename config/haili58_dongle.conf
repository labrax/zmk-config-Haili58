# Dongle build overrides. Everything else comes from haili58.conf.

# No OLED on the central.
CONFIG_ZMK_DISPLAY=n

# Both halves are peripherals when the dongle is the central (default is 1).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# The dongle runs off USB; deep sleep would just make it disappear.
CONFIG_ZMK_SLEEP=n
